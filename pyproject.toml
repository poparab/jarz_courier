[project]
name = "jarz_courier"
authors = [
    { name = "Abdelrahman Mamdouh", email = "abdelrahmanmamdouh1996@gmail.com"}
]
description = "Courier execution app for Jarz — run sheet, proof of delivery, duty sessions and courier statement. Layered on jarz_pos."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0"   # Installed and managed by bench.
    # "jarz_pos"         # Declared as `required_apps` in hooks.py, installed by bench.
    #
    # NOTE: this app deliberately has no third-party runtime dependency. If one is
    # ever added it MUST be added to requirements.txt as well — deploy_backend.ps1
    # triggers its editable reinstall off a diff in pyproject.toml/requirements.txt,
    # so a dependency listed in only one of the two silently never installs.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
